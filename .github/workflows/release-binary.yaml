---
name: Release binary

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:

  binary-release:
    name: binary release
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0

      - name: build & test
        run: |
          make dependencies
          make build-all

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          generate_release_notes: true
          files: |
            _output/*
